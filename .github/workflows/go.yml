name: Go

on:
  pull_request: {} # Includes PRs targeting an intermediate branch in a stack.
  push:
    branches: [main, 'p1/**', 'hardening/**', 'stack/**']
    tags: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22.12'
          cache: false
      - name: Build
        run: go build -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -count=1 -cover ./...
      - name: Race detector
        run: go test -mod=readonly -count=1 -race ./...
      - name: Rotation conformance (reference and negative control)
        run: python3 conformance/test_reference.py
      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.61.0
          args: --timeout=5m
          skip-cache: true
      - name: Verify checked-in protobuf code
        run: bash .github/scripts/verify-proto.sh
